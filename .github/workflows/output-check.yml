name: Output check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: output-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/browser.lock.json') }}
      - name: Verify runner prerequisites
        run: |
          swift --version
          swiftlint version
          cargo --version
          ffmpeg -version
          ffprobe -version
      - run: make bootstrap
      - run: make ci
      - name: Upload visual comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: tests/reports/
          retention-days: 30
      - name: Publish visual summary
        if: always()
        run: |
          if [ -f tests/reports/visual/results.json ]; then
            node tests/tools/visual-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
