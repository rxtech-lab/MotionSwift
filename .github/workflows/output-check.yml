name: Output check
on:
  push:
permissions:
  contents: read
concurrency:
  group: output-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make bootstrap
      - name: Probe hardware encoder access
        run: node tests/tools/hardware-capabilities.mjs
      - name: Run make ci
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/motionswift-ci.log"
          if make ci 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          matches=$(grep -Ei '✘|error:|fatal:|^FAIL|^not ok|^3D |Test Case .+ failed|failed after|make: \*\*\*|Assertion Failure' "$log" | tail -n 30 || true)
          if [ -z "$matches" ]; then matches=$(tail -n 16 "$log"); fi
          while IFS= read -r line; do
            printf '::error title=make ci failure::%s\n' "${line//%/%25}"
          done <<< "$matches"
          exit "$status"
        env:
          MTL_DEBUG_LAYER: '1'
      - name: Publish map compatibility summary
        if: always()
        shell: bash
        run: |
          for report in tests/reports/maps/results.json tests/reports/maps/railway/results.json; do
            if [ -f "$report" ]; then
              node --input-type=module -e '
                import fs from "node:fs";
                const r = JSON.parse(fs.readFileSync(process.argv[1]));
                console.log(`### Map compatibility: ${r.pass ? "PASS" : "FAIL"}\n\n${r.scope}\n`);
                for (const x of r.results) console.log(x.error ? `- ${x.error}` : `- ${x.id}@${x.frame} (${x.backend}): ${x.pass ? "PASS" : "FAIL"}, ${(x.diffRatio * 100).toFixed(4)}% changed, repeatable: ${x.deterministic}`);
              ' "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Check real Test Film visual regressions
        shell: bash
        run: |
          fixture=$(mktemp -d "$RUNNER_TEMP/motionswift-test-film.XXXXXX")
          trap 'rm -rf "$fixture"' EXIT
          shasum -a 256 -c tests/fixtures/test-film/project.zip.sha256
          unzip -q tests/fixtures/test-film/project.zip -d "$fixture"
          TEST_FILM_PROJECT="$fixture" node tests/tools/test-film-ci.mjs check
      # Adding iOS native slices can run swift package clean and remove the host CLI.
      # Finish the macOS visual checks before building those slices.
      - name: Build MotionStudio for iOS and iPadOS (simulator + device, Debug + Release)
        run: make ios
      - name: Upload visual comparisons and showcase UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-results
          path: tests/reports/
          retention-days: 30
      - name: Publish visual summary
        if: always()
        run: |
          if ls tests/reports/visual/*/results.json >/dev/null 2>&1; then
            node tests/tools/visual-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
          for backend in cpu gpu; do
            report="tests/reports/three/$backend/results.json"
            if [ -f "$report" ]; then
              node -e 'const r=require(process.argv[1]);console.log(`### 3D visual (${r.backend}): ${r.pass?"PASS":"FAIL"}\n\n| Fixture | Frame | Changed | >${r.gate.largeDelta} | PSNR | Repeatable |\n|---|---|---|---|---|---|\n`+r.results.filter(x=>!x.error).map(x=>`| ${x.id} | ${x.frame} | ${(x.changedRatio*100).toFixed(3)}% | ${(x.largeDeltaRatio*100).toFixed(3)}% | ${x.psnr} dB | ${x.deterministic?"yes":"no"} |`).join("\n"))' "$PWD/$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
