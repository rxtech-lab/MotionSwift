name: Regenerate goldens
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  goldens:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/browser.lock.json') }}
      - run: npm ci --prefix tests
      - run: make goldens
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-goldens-for-review
          path: tests/golden/
          retention-days: 30
