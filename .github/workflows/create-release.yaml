name: Create a new release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release:
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create version tag and GitHub Release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        with:
          skip_npm_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  showcase-dmg:
    needs: create-release
    if: needs.create-release.outputs.published == 'true'
    uses: ./.github/workflows/showcase-release.yml
    with:
      release_tag: ${{ needs.create-release.outputs.tag }}
    secrets: inherit
