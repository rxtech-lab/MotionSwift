[package]
name = "motionswift-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
skia-safe = { version = "=0.99.0", features = ["metal", "textlayout", "svg", "webp"] }

[build-dependencies]
cc = "1"
# Build the pinned bindings first so their matching Skia headers exist before the C++ bridge.
skia-bindings = { version = "=0.99.0", features = ["metal", "textlayout", "svg", "webp"] }
